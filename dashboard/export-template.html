<style>
/* ============================================
   DE STIJL DESIGN SYSTEM
   ============================================ */
:root {
  --mondrian-red: var(--red);
  --mondrian-blue: var(--blue);
  --mondrian-yellow: var(--yellow);
  --mondrian-black: var(--ink);
  --mondrian-white: var(--paper);
  --mondrian-gray: var(--muted);
  --accent-green: var(--green);
  --accent-sienna: #B5602A;
  --grid-border: 5px solid var(--mondrian-black);
  --grid-border-thin: 3px solid var(--mondrian-black);
}

*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

html, body {
  max-width: 100%;
  overflow-x: hidden;
}

body {
  background: var(--mondrian-black);
  color: var(--mondrian-black);
  font-family: "Source Serif 4", Georgia, serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ============================================
   TOP BAR
   ============================================ */
.topbar {
  height: 56px;
  background: var(--mondrian-black);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  border-bottom: var(--grid-border);
  position: sticky;
  top: 0;
  z-index: 1000;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.topbar-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  flex-shrink: 0;
}

.topbar-logo svg {
  height: 28px;
  width: auto;
}

.topbar-logo-block {
  width: 8px;
  height: 24px;
}

.topbar-logo-block.r { background: var(--mondrian-red); }
.topbar-logo-block.b { background: var(--mondrian-blue); }
.topbar-logo-block.y { background: var(--mondrian-yellow); }

.topbar-title {
  font-family: "DM Sans", sans-serif;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--mondrian-white);
}

.topbar-badge {
  font-family: "DM Sans", sans-serif;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--mondrian-black);
  background: var(--mondrian-yellow);
  padding: 4px 14px;
  display: inline-block;
}

.topbar-nav {
  display: flex;
  gap: 0;
}

.topbar-nav button {
  font-family: "DM Sans", sans-serif;
  font-weight: 500;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--mondrian-gray);
  background: transparent;
  border: none;
  padding: 8px 18px;
  cursor: pointer;
  transition: color 0.2s ease, background 0.2s ease;
  position: relative;
}

.topbar-nav button:hover {
  color: var(--mondrian-white);
}

.topbar-nav button.active {
  color: var(--mondrian-white);
  background: rgba(255,255,255,0.08);
}

.topbar-nav button.active::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 24px;
  height: 3px;
  background: var(--mondrian-yellow);
}

/* ============================================
   UPDATE NOTIFICATION STRIP
   ============================================ */
.update-strip {
  height: 32px;
  background: var(--mondrian-yellow);
  color: var(--mondrian-black);
  font-family: "DM Sans", sans-serif;
  font-size: 11px;
  font-weight: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 0 24px;
}

.update-strip.hidden {
  display: none;
}

.update-strip-dismiss {
  background: transparent;
  border: none;
  cursor: pointer;
  font-size: 14px;
  color: var(--mondrian-black);
  opacity: 0.6;
  padding: 0 4px;
  line-height: 1;
}

.update-strip-dismiss:hover {
  opacity: 1;
}

/* ============================================
   VIEW CONTAINERS
   ============================================ */
.view {
  display: none;
  min-height: calc(100vh - 56px);
}

.view.active {
  display: block;
}

/* ============================================
   MONDRIAN GRID -- THE PAINTING
   ============================================ */
.mondrian-grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr;
  grid-auto-rows: minmax(160px, 1fr);
  gap: 5px;
  background: var(--mondrian-black);
  margin: 0;
  padding: 5px;
  min-height: calc(100vh - 56px);
  width: 100%;
  max-width: 100%;
  overflow: hidden;
  box-sizing: border-box;
}

.mondrian-cell {
  padding: 28px 24px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  opacity: 0;
  animation: cellAssemble 0.6s ease forwards;
  min-width: 0; /* prevent grid blowout */
}

.mondrian-cell:hover {
  transform: scale(1.02);
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  z-index: 10;
}

@keyframes cellAssemble {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

/* Cell typography */
.cell-section-label {
  font-family: "DM Sans", sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.cell-title {
  font-family: "Playfair Display", Georgia, serif;
  font-weight: 700;
  font-size: 20px;
  line-height: 1.25;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.cell-summary {
  font-family: "Source Serif 4", Georgia, serif;
  font-size: 13px;
  line-height: 1.5;
  margin-top: 8px;
  opacity: 0.85;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: break-word;
}

.cell-meta {
  font-family: "JetBrains Mono", monospace;
  font-size: 10px;
  letter-spacing: 0.05em;
  margin-top: auto;
  opacity: 0.6;
}

/* Artifact count badge */
.cell-count {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  position: absolute;
  top: 12px;
  right: 14px;
  opacity: 0.6;
}

/* Focus rings for keyboard navigation */
.mondrian-cell:focus-visible {
  outline: 3px solid var(--mondrian-yellow);
  outline-offset: -3px;
  z-index: 11;
}

/* Light text for dark bg cells */
.mondrian-cell.dark-bg {
  color: var(--mondrian-white);
}

.mondrian-cell.dark-bg .cell-section-label {
  color: rgba(247,243,237,0.8);
}

/* Dark text for light bg cells */
.mondrian-cell.light-bg {
  color: var(--mondrian-black);
}

.mondrian-cell.light-bg .cell-section-label {
  color: rgba(26,26,26,0.6);
}

/* Cell action bar -- always visible, enhanced on hover */
.cell-actions {
  display: flex;
  gap: 6px;
  position: absolute;
  top: 10px;
  left: 14px;
  opacity: 0.6;
  transition: opacity 0.2s ease;
  z-index: 2;
}

.mondrian-cell:hover .cell-actions,
.mondrian-cell:focus-within .cell-actions {
  opacity: 1;
}

.cell-action-btn {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 6px 12px;
  min-height: 32px;
  min-width: 44px;
  border: 1px solid rgba(247,243,237,0.3);
  border-radius: 3px;
  background: rgba(26,26,26,0.7);
  color: rgba(247,243,237,0.9);
  cursor: pointer;
  backdrop-filter: blur(8px);
  transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
}

.cell-action-btn:hover {
  background: rgba(26,26,26,0.95);
  border-color: var(--mondrian-yellow);
  color: var(--mondrian-yellow);
  transform: translateY(-1px);
}

.cell-action-btn:focus-visible {
  outline: 2px solid var(--mondrian-yellow);
  outline-offset: 2px;
}

.cell-action-btn:active {
  transform: scale(0.97);
}

.mondrian-cell.light-bg .cell-action-btn {
  background: rgba(247,243,237,0.7);
  color: var(--mondrian-black);
  border-color: rgba(26,26,26,0.2);
}

.mondrian-cell.light-bg .cell-action-btn:hover {
  background: rgba(247,243,237,0.95);
  border-color: var(--mondrian-blue);
  color: var(--mondrian-blue);
}

.mondrian-cell.light-bg .cell-action-btn:focus-visible {
  outline-color: var(--mondrian-blue);
}

/* Command panel -- slide-in results viewer */
.command-panel {
  position: fixed;
  top: 0;
  right: -480px;
  width: 480px;
  height: 100vh;
  background: #111;
  border-left: 3px solid var(--mondrian-yellow);
  z-index: 1000;
  transition: right 0.3s ease;
  display: flex;
  flex-direction: column;
  font-family: "JetBrains Mono", monospace;
}

.command-panel.open {
  right: 0;
}

.command-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid rgba(247,243,237,0.1);
  flex-shrink: 0;
}

.command-panel-title {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--mondrian-yellow);
}

.command-panel-close {
  font-size: 18px;
  background: none;
  border: none;
  color: rgba(247,243,237,0.5);
  cursor: pointer;
  padding: 4px 8px;
}

.command-panel-close:hover {
  color: var(--mondrian-white);
}

.command-panel-cmd {
  padding: 12px 20px;
  font-size: 13px;
  color: rgba(247,243,237,0.5);
  border-bottom: 1px solid rgba(247,243,237,0.05);
  flex-shrink: 0;
}

.command-panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  font-size: 13px;
  line-height: 1.7;
  color: rgba(247,243,237,0.85);
  white-space: pre-wrap;
  word-break: break-word;
}

.command-panel-status {
  padding: 12px 20px;
  font-size: 11px;
  color: rgba(247,243,237,0.4);
  border-top: 1px solid rgba(247,243,237,0.05);
  flex-shrink: 0;
}

.command-panel-status.running {
  color: var(--mondrian-yellow);
}

.command-panel-status.done {
  color: var(--accent-green);
}

.command-panel-status.error {
  color: var(--mondrian-red);
}

/* Stage cell special */
.cell-stage {
  cursor: default;
  justify-content: center;
  align-items: center;
}

.cell-stage:hover {
  transform: none;
  box-shadow: none;
}

.cell-stage .stage-label {
  font-family: "Playfair Display", Georgia, serif;
  font-weight: 800;
  font-size: 42px;
  color: var(--mondrian-black);
  text-align: center;
}

.cell-stage .stage-sub {
  font-family: "DM Sans", sans-serif;
  font-weight: 500;
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(26,26,26,0.5);
  text-align: center;
  margin-top: 4px;
}

/* ============================================
   DOCUMENT VIEW
   ============================================ */
.doc-view {
  display: flex;
  min-height: calc(100vh - 56px);
  background: var(--mondrian-white);
}

.doc-rail {
  width: 200px;
  min-height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  flex-shrink: 0;
  transition: background 0.5s ease;
}

.doc-rail-label {
  font-family: "DM Sans", sans-serif;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.9);
  writing-mode: vertical-rl;
  text-orientation: mixed;
  transform: rotate(180deg);
}

.doc-rail-back {
  position: absolute;
  top: 24px;
  left: 50%;
  transform: translateX(-50%);
  font-family: "DM Sans", sans-serif;
  font-weight: 500;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.7);
  background: transparent;
  border: 2px solid rgba(255,255,255,0.3);
  padding: 8px 16px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.doc-rail-back:hover {
  color: #fff;
  border-color: rgba(255,255,255,0.7);
}

.doc-rail.light-rail .doc-rail-label {
  color: rgba(26,26,26,0.8);
}

.doc-rail.light-rail .doc-rail-back {
  color: rgba(26,26,26,0.6);
  border-color: rgba(26,26,26,0.3);
}

.doc-rail.light-rail .doc-rail-back:hover {
  color: var(--mondrian-black);
  border-color: rgba(26,26,26,0.6);
}

/* Document sidebar navigation */
.doc-sidebar-nav {
  width: 240px;
  border-left: var(--grid-border);
  padding: 16px 0;
  flex-shrink: 0;
  overflow-y: auto;
  max-height: calc(100vh - 56px);
  position: sticky;
  top: 56px;
  align-self: flex-start;
  background: var(--mondrian-white);
}

.doc-sidebar-nav-title {
  font-family: "DM Sans", sans-serif;
  font-weight: 700;
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(26,26,26,0.4);
  padding: 4px 16px;
  margin-bottom: 8px;
}

.doc-nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  cursor: pointer;
  transition: all 0.15s;
  border-left: 3px solid transparent;
  color: rgba(26,26,26,0.6);
  font-family: "DM Sans", sans-serif;
  font-size: 13px;
  text-decoration: none;
}

.doc-nav-item:hover {
  background: rgba(26,26,26,0.04);
  color: var(--mondrian-black);
}

.doc-nav-item.active {
  background: rgba(26,26,26,0.04);
  color: var(--mondrian-black);
}

.doc-nav-dot {
  width: 8px;
  height: 8px;
  flex-shrink: 0;
}

.doc-nav-count {
  margin-left: auto;
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  color: rgba(26,26,26,0.35);
}

.doc-content {
  flex: 1;
  padding: 48px 56px 80px 56px;
  max-width: 820px;
  overflow-y: auto;
  border-left: var(--grid-border);
}

.doc-toc {
  width: 220px;
  padding: 48px 20px;
  border-left: var(--grid-border-thin);
  flex-shrink: 0;
  position: sticky;
  top: 56px;
  align-self: flex-start;
  max-height: calc(100vh - 56px);
  overflow-y: auto;
}

.doc-toc-title {
  font-family: "DM Sans", sans-serif;
  font-weight: 700;
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(26,26,26,0.4);
  margin-bottom: 16px;
}

.doc-toc a {
  display: block;
  font-family: "DM Sans", sans-serif;
  font-size: 12px;
  color: rgba(26,26,26,0.6);
  text-decoration: none;
  padding: 5px 0;
  line-height: 1.4;
  transition: color 0.2s ease;
}

.doc-toc a:hover {
  color: var(--mondrian-black);
}

.doc-toc a.toc-h3 {
  padding-left: 14px;
  font-size: 11px;
}

/* Frontmatter infobox */
.frontmatter-box {
  border-top: 4px solid var(--mondrian-black);
  background: rgba(26,26,26,0.03);
  padding: 16px 20px;
  margin-bottom: 32px;
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  line-height: 1.7;
  color: rgba(26,26,26,0.6);
}

.frontmatter-box strong {
  color: var(--mondrian-black);
}

/* Markdown rendered content */
.doc-body h1 {
  font-family: "Playfair Display", Georgia, serif;
  font-weight: 700;
  font-size: 32px;
  line-height: 1.2;
  margin-bottom: 24px;
  color: var(--mondrian-black);
  border-bottom: 3px solid var(--mondrian-black);
  padding-bottom: 16px;
}

.doc-body h2 {
  font-family: "Playfair Display", Georgia, serif;
  font-weight: 600;
  font-size: 22px;
  margin-top: 40px;
  margin-bottom: 16px;
  color: var(--mondrian-black);
}

.doc-body h3 {
  font-family: "DM Sans", sans-serif;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.04em;
  margin-top: 28px;
  margin-bottom: 12px;
  color: var(--mondrian-black);
}

.doc-body h4 {
  font-family: "DM Sans", sans-serif;
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0.04em;
  margin-top: 20px;
  margin-bottom: 8px;
}

.doc-body p {
  font-family: "Source Serif 4", Georgia, serif;
  font-size: 15px;
  line-height: 1.75;
  margin-bottom: 14px;
  color: rgba(26,26,26,0.85);
}

.doc-body ul, .doc-body ol {
  margin-bottom: 14px;
  padding-left: 24px;
}

.doc-body li {
  font-family: "Source Serif 4", Georgia, serif;
  font-size: 14px;
  line-height: 1.7;
  margin-bottom: 6px;
  color: rgba(26,26,26,0.85);
}

.doc-body strong {
  font-weight: 600;
  color: var(--mondrian-black);
}

.doc-body blockquote {
  border-left: 4px solid var(--mondrian-yellow);
  padding: 12px 20px;
  margin: 20px 0;
  background: rgba(232,185,49,0.06);
  font-style: italic;
}

.doc-body blockquote p {
  margin-bottom: 0;
}

.doc-body code {
  font-family: "JetBrains Mono", monospace;
  font-size: 13px;
  background: rgba(26,26,26,0.06);
  padding: 2px 6px;
}

.doc-body pre {
  background: var(--mondrian-black);
  color: var(--mondrian-white);
  padding: 20px 24px;
  margin: 16px 0;
  overflow-x: auto;
  font-family: "JetBrains Mono", monospace;
  font-size: 13px;
  line-height: 1.6;
}

.doc-body pre code {

function initUpdateStrip() {
  var updates = ROOM_DATA.updates || [];

/* ============================================
   BUILD MONDRIAN GRID
   ============================================ */
function buildGrid() {
  var grid = document.getElementById('mondrian-grid');
  grid.innerHTML = '';
  var sections = ROOM_DATA.sections || [];

  if (sections.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1;padding:80px;text-align:center;color:var(--mondrian-white);font-family:Playfair Display,serif;font-size:24px;">No sections in this room yet.</div>';
    return;
  }

  /* Sort sections: filled first (by artifact count desc), empty last */
  var filled = sections.filter(function(s) { return s.entryCount > 0; });
  var empty = sections.filter(function(s) { return s.entryCount === 0; });
  filled.sort(function(a, b) { return b.entryCount - a.entryCount; });
  var sorted = filled.concat(empty);

  /* Compute total artifacts for proportional sizing */
  var maxCount = Math.max.apply(null, sections.map(function(s) { return s.entryCount || 0; }).concat([1]));

  /* Dynamic grid: filled sections get prominent slots, empty get small gap cells */
  var totalCells = sorted.length + 1; /* +1 for stage badge */
  var rowCount = Math.max(3, Math.ceil(totalCells / 3));

  /* Build grid template rows dynamically */
  var rowSizes = [];
  for (var r = 0; r < rowCount; r++) {
    if (r === 0) rowSizes.push('minmax(200px, 2fr)');
    else if (r < 2) rowSizes.push('minmax(160px, 1.5fr)');
    else rowSizes.push('minmax(120px, 1fr)');
  }
  grid.style.gridTemplateRows = rowSizes.join(' ');

  /* Build layout: top-heavy sections get multi-column spans */
  var layouts = [];
  var row = 1;
  var col = 1;
  var idx = 0;

  /* First cell (most artifacts): give it dominant position */
  if (sorted.length > 0 && sorted[0].entryCount > 0) {
    layouts.push({ col: '1 / 2', row: '1 / 3', size: 'large' }); /* span 2 rows */
    idx = 1;
    /* Second cell: wide top right */
    if (sorted.length > 1 && sorted[1].entryCount > 0) {
      layouts.push({ col: '2 / 4', row: '1 / 2', size: 'wide' });
      idx = 2;
    }
    /* Stage badge: small cell */
    /* Third cell: medium */
    if (sorted.length > 2 && sorted[2].entryCount > 0) {
      layouts.push({ col: '2 / 3', row: '2 / 3', size: 'medium' });
      idx = 3;
    }
    /* Stage badge slot: 3/4 row 2/3 -- placed separately */
  }

  /* Remaining filled sections: flow into grid */
  row = 3; col = 1;
  for (var fi = idx; fi < filled.length; fi++) {
    var span = filled[fi].entryCount >= 3 ? 2 : 1;
    if (col + span - 1 > 3) { row++; col = 1; }
    var colEnd = col + span;
    layouts.push({ col: col + ' / ' + colEnd, row: row + ' / ' + (row + 1), size: span > 1 ? 'wide' : 'normal' });
    col = colEnd;
    if (col > 3) { row++; col = 1; }
  }

  /* Empty sections: small gap cells at bottom */
  if (col > 1 && empty.length > 0) { row++; col = 1; }
  for (var ei = 0; ei < empty.length; ei++) {
    if (col > 3) { row++; col = 1; }
    layouts.push({ col: col + ' / ' + (col + 1), row: row + ' / ' + (row + 1), size: 'gap' });
    col++;
  }

  /* Recalculate row count and update */
  var actualRows = row;
  rowSizes = [];
  for (r = 0; r < actualRows; r++) {
    if (r === 0) rowSizes.push('minmax(200px, 2fr)');
    else if (r < 2) rowSizes.push('minmax(160px, 1.5fr)');
    else rowSizes.push('minmax(100px, 1fr)');
  }
  grid.style.gridTemplateRows = rowSizes.join(' ');

  var stagePlaced = false;

  sorted.forEach(function(section, i) {
    var cell = document.createElement('div');
    cell.className = 'mondrian-cell';
    var isGap = section.entryCount === 0;
    var sectionColor = isGap ? '#2A2A2A' : (section.color || SECTION_COLORS[section.id] || '#F7F3ED');
    cell.style.background = sectionColor;
    cell.style.animationDelay = (i * 50) + 'ms';

    /* Determine light/dark text */
    var isDark = isGap || section.lightText || DARK_BG_SECTIONS.indexOf(section.id) >= 0;
    cell.classList.add(isDark ? 'dark-bg' : 'light-bg');

    /* Grid position from computed layout */
    var layout = layouts[i] || { col: 'auto', row: 'auto', size: 'normal' };
    cell.style.gridColumn = layout.col;
    cell.style.gridRow = layout.row;

    /* Insert stage badge after position 2 */
    if (i === 2 && !stagePlaced) {
      var stageCell = document.createElement('div');
      stageCell.className = 'mondrian-cell cell-stage';
      stageCell.style.background = 'var(--mondrian-yellow)';
      stageCell.style.gridColumn = '3 / 4';
      stageCell.style.gridRow = '2 / 3';
      stageCell.style.animationDelay = '100ms';
      stageCell.innerHTML = '<div class="stage-label">' + escHtml(ROOM_DATA.stage || 'Discovery') + '</div><div class="stage-sub">Venture Stage</div>';
      grid.appendChild(stageCell);
      stagePlaced = true;
    }

    /* Cell content */
    cell.setAttribute('data-section', section.id);
    cell.setAttribute('tabindex', '0');
    cell.setAttribute('role', 'button');
    cell.setAttribute('aria-label', (section.label || section.id) + ', ' + (section.entryCount || 0) + ' artifacts. Click to view documents.');
    cell.onclick = function() { openDoc(section.id); };
    cell.onkeydown = function(e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDoc(section.id); } };

    var sectionLabel = section.label || SECTION_LABELS[section.id] || section.id;

    if (isGap) {
      /* Empty section: show as gap with contextual action */
      var isOppBank = section.id === 'opportunity-bank';
      cell.style.opacity = isOppBank ? '0.8' : '0.5';
      cell.style.borderStyle = 'dashed';
      if (isOppBank) {
        cell.style.borderColor = 'var(--mondrian-yellow)';
        cell.style.borderWidth = '2px';
      }

      var gapActions = SECTION_ACTIONS[section.id] || SECTION_ACTIONS['_default'];
      var gapActionHtml = '<div class="cell-actions" style="opacity:1;">';
      /* Show just the first action for gap cells - the most relevant one */
      var firstAction = gapActions[0];
      gapActionHtml += '<button class="cell-action-btn" title="' + escHtml(firstAction.jtbd) + '" onclick="event.stopPropagation();runCommand(\'' + firstAction.cmd + '\',\'' + escHtml(section.id) + '\')" style="' + (isOppBank ? 'border-color:var(--mondrian-yellow);color:var(--mondrian-yellow);' : '') + '">' + escHtml(firstAction.label) + '</button>';
      gapActionHtml += '</div>';

      cell.innerHTML = gapActionHtml +
        '<div class="cell-section-label" style="opacity:0.7;">' + escHtml(sectionLabel) + '</div>' +
        '<div class="cell-title" style="font-size:14px;opacity:' + (isOppBank ? '0.85' : '0.6') + ';">' + (isOppBank ? 'Scan for Opportunities' : 'Gap - not started') + '</div>';
    } else {
      var countText = section.entryCount === 1 ? '1 artifact' : (section.entryCount || 0) + ' artifacts';
      var summaryText = section.summary || '';
      if (summaryText.match(/^\|/) || summaryText.match(/^\*\*Filed/)) summaryText = '';

      /* Scale font based on cell importance */
      var titleSize = layout.size === 'large' ? '24px' : layout.size === 'wide' ? '22px' : '18px';

      var actions = SECTION_ACTIONS[section.id] || SECTION_ACTIONS['_default'];
      var actionHtml = '<div class="cell-actions">';
      actions.forEach(function(a) {
        actionHtml += '<button class="cell-action-btn" title="' + escHtml(a.jtbd) + '" onclick="event.stopPropagation();runCommand(\'' + a.cmd + '\',\'' + escHtml(section.id) + '\')">' + escHtml(a.label) + '</button>';
      });
      actionHtml += '</div>';

      cell.innerHTML = actionHtml +
        '<span class="cell-count">' + escHtml(countText) + '</span>' +
        '<div class="cell-section-label">' + escHtml(sectionLabel) + '</div>' +
        '<div class="cell-title" style="font-size:' + titleSize + ';">' + escHtml(sectionLabel) + '</div>' +
        (summaryText ? '<div class="cell-summary">' + escHtml(summaryText) + '</div>' : '');
    }

    grid.appendChild(cell);
  });

  /* Add stage badge if we had fewer than 3 sections */
  if (!stagePlaced) {
    var stageCell = document.createElement('div');
    stageCell.className = 'mondrian-cell cell-stage';
    stageCell.style.background = 'var(--mondrian-yellow)';
    stageCell.style.gridColumn = '3 / 4';
    stageCell.style.gridRow = '1 / 2';
    stageCell.style.animationDelay = '100ms';
    stageCell.innerHTML = '<div class="stage-label">' + escHtml(ROOM_DATA.stage || 'Discovery') + '</div><div class="stage-sub">Venture Stage</div>';
    grid.appendChild(stageCell);
  }

  /* Legend strip at bottom of grid */
  var legendRow = actualRows + 1;
  var legendCell = document.createElement('div');
  legendCell.className = 'mondrian-cell';
  legendCell.style.gridColumn = '1 / -1';
  legendCell.style.gridRow = legendRow + ' / ' + (legendRow + 1);
  legendCell.style.background = 'var(--mondrian-black)';
  legendCell.style.padding = '12px 24px';
  legendCell.style.display = 'flex';
  legendCell.style.flexDirection = 'row';
  legendCell.style.flexWrap = 'wrap';
  legendCell.style.alignItems = 'center';
  legendCell.style.justifyContent = 'center';
  legendCell.style.gap = '24px';
  legendCell.style.cursor = 'default';
  legendCell.style.minHeight = '64px';
  legendCell.style.borderTop = '3px solid rgba(247,243,237,0.15)';

  var legendItems = [];
  sorted.forEach(function(s) {
    var c = s.entryCount === 0 ? '#2A2A2A' : (s.color || SECTION_COLORS[s.id] || '#5C5A56');
    var lbl = s.label || SECTION_LABELS[s.id] || s.id;
    legendItems.push(
      '<span style="display:inline-flex;align-items:center;gap:8px;font-family:DM Sans,sans-serif;font-size:13px;font-weight:500;letter-spacing:0.04em;color:rgba(247,243,237,0.75);">' +
      '<span style="width:14px;height:14px;border-radius:3px;background:' + c + ';border:1px solid rgba(247,243,237,0.25);flex-shrink:0;"></span>' +
      escHtml(lbl) + ' <span style="opacity:0.5;font-size:11px;">(' + (s.entryCount || 0) + ')</span>' +
      '</span>'
    );
  });
  legendCell.innerHTML = legendItems.join('');
  grid.appendChild(legendCell);
}

/* ============================================
   DOCUMENT VIEWER
   ============================================ */
function stripFrontmatter(md) {
  var match = md.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
  if (match) return { frontmatter: match[1], body: match[2] };
  return { frontmatter: null, body: md };
}

function parseFrontmatter(fm) {
  if (!fm) return {};
  var obj = {};
  fm.split('\n').forEach(function(line) {
    var m = line.match(/^(\w[\w-]*):\s*(.+)$/);
    if (m) obj[m[1]] = m[2].replace(/^["']|["']$/g, '');
  });
  return obj;
}

var LIGHT_RAIL_SECTIONS = ['market-analysis', 'competitive-analysis', 'team-execution', 'meeting', 'legal-ip', 'financial-model'];

function openDoc(section) {
  var script = document.getElementById('content-' + section);
  if (!script) {
    /* No content for this section */
    switchView('overview');
    return;
  }

  var raw = script.textContent;
  var parsed = stripFrontmatter(raw);
  var fmData = parseFrontmatter(parsed.frontmatter);

  /* Rail color */
  var rail = document.getElementById('doc-rail');
  var color = SECTION_COLORS[section] || '#1A1A1A';
  /* Find section-specific color from ROOM_DATA */
  var sectionData = (ROOM_DATA.sections || []).find(function(s) { return s.id === section; });
  if (sectionData && sectionData.color) color = sectionData.color;

  rail.style.background = color;
  rail.className = 'doc-rail' + (LIGHT_RAIL_SECTIONS.indexOf(section) >= 0 ? ' light-rail' : '');
  document.getElementById('doc-rail-label').textContent = SECTION_LABELS[section] || (sectionData && sectionData.label) || section;

  /* Frontmatter infobox */
  var fmBox = document.getElementById('doc-frontmatter');
  if (parsed.frontmatter) {
    fmBox.style.borderTopColor = color;
    var html = '';
    for (var k in fmData) {
      if (fmData.hasOwnProperty(k)) html += '<strong>' + escHtml(k) + ':</strong> ' + escHtml(fmData[k]) + '<br>';
    }
    fmBox.innerHTML = html;
    fmBox.style.display = 'block';
  } else {
    fmBox.style.display = 'none';
  }

  /* Render markdown */
  var rendered = marked.parse(parsed.body);
  document.getElementById('doc-body').innerHTML = rendered;

  /* Render mermaid diagrams */
  initMermaid();

  /* Build TOC */
  var tocContainer = document.getElementById('doc-toc-links');
  tocContainer.innerHTML = '';
  var headings = document.getElementById('doc-body').querySelectorAll('h2, h3');
  headings.forEach(function(h, i) {
    var id = 'heading-' + i;
    h.id = id;
    var a = document.createElement('a');
    a.href = '#' + id;
    a.textContent = h.textContent;
    if (h.tagName === 'H3') a.className = 'toc-h3';
    tocContainer.appendChild(a);
  });

  /* Update sidebar active state */
  document.querySelectorAll('.doc-nav-item').forEach(function(item) {
    item.classList.remove('active');
    if (item.getAttribute('data-section') === section) {
      item.classList.add('active');
      item.style.borderLeftColor = color;
    } else {
      item.style.borderLeftColor = 'transparent';
    }
  });

  /* Switch to document view */
  document.querySelectorAll('.view').forEach(function(v) { v.classList.remove('active'); });
  document.getElementById('view-document').classList.add('active');
  document.querySelectorAll('.topbar-nav button').forEach(function(b) { b.classList.remove('active'); });

  /* Scroll to top of content */
  document.querySelector('.doc-content').scrollTop = 0;
}

function backToOverview() {
  document.querySelectorAll('.view').forEach(function(v) { v.classList.remove('active'); });
  document.getElementById('view-overview').classList.add('active');
  document.querySelector('.topbar-nav button[data-view="overview"]').classList.add('active');
}

  var codeBlocks = document.querySelectorAll('.doc-body pre code.language-mermaid');

    var pre = code.parentElement;

}

/* ============================================
   KNOWLEDGE GRAPH (Cytoscape.js)
   ============================================ */
var cyInstance = null;
var cyInitialized = false;

function initGraph() {
  if (cyInitialized) return;
  cyInitialized = true;

  var elements = (ROOM_DATA.graph && ROOM_DATA.graph.elements) || { nodes: [], edges: [] };
  var allNodes = elements.nodes || [];
  var allEdges = elements.edges || [];

  if (allNodes.length === 0) {
    document.getElementById('cy').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;font-family:Source Serif 4,serif;font-size:18px;color:rgba(26,26,26,0.4);font-style:italic;">No graph data available. Build the knowledge graph with /mos:room graph.</div>';
    return;
  }

  /* Graph overlay info */
  document.getElementById('graph-overlay').innerHTML =
    ROOM_DATA.roomName + ' &middot; ' + allNodes.length + ' nodes &middot; ' + allEdges.length + ' edges<br>Powered by MindrianOS';

  var layoutName = allNodes.length < 13 ? 'grid' : 'cose';

  cyInstance = cytoscape({
    container: document.getElementById('cy'),
    elements: elements,
    style: [
      /* Section nodes */
      {
        selector: 'node.section-group',
        style: {
          'background-color': 'data(color)',
          'label': 'data(label)',
          'color': '#F7F3ED',
          'text-valign': 'center',
          'text-halign': 'center',
          'font-family': '"DM Sans", sans-serif',
          'font-size': '10px',
          'font-weight': 700,
          'width': 90,
          'height': 90,
          'text-wrap': 'wrap',
          'text-max-width': '80px',
          'border-width': 4,
          'border-color': '#1A1A1A',
          'shape': 'rectangle',
          'transition-property': 'opacity, width, height',
          'transition-duration': '0.3s'
        }
      },
      /* Artifact nodes */
      {
        selector: 'node.artifact',
        style: {
          'background-color': 'data(color)',
          'background-opacity': 0.6,
          'label': 'data(label)',
          'color': '#1A1A1A',
          'text-valign': 'center',
          'text-halign': 'center',
          'font-family': '"Source Serif 4", serif',
          'font-size': '8px',
          'width': 50,
          'height': 50,
          'text-wrap': 'wrap',
          'text-max-width': '45px',
          'border-width': 2,
          'border-color': '#1A1A1A',
          'shape': 'rectangle',
          'transition-property': 'opacity, width, height',
          'transition-duration': '0.3s'
        }
      },
      /* Meeting nodes */
      {
        selector: 'node.meeting',
        style: {
          'background-color': '#D4A843',
          'label': 'data(label)',
          'shape': 'diamond',
          'width': 60,
          'height': 60,
          'color': '#1A1A1A',
          'font-family': '"DM Sans", sans-serif',
          'font-size': '9px',
          'font-weight': 600,
          'text-valign': 'center',
          'text-halign': 'center',
          'text-wrap': 'wrap',
          'text-max-width': '55px',
          'border-width': 4,
          'border-color': '#1A1A1A',
          'transition-property': 'opacity',
          'transition-duration': '0.3s'
        }
      },
      /* Speaker nodes */
      {
        selector: 'node.speaker',
        style: {
          'background-color': '#1E3A6E',
          'label': 'data(label)',
          'shape': 'ellipse',
          'width': 50,
          'height': 50,
          'color': '#F7F3ED',
          'font-family': '"DM Sans", sans-serif',
          'font-size': '8px',
          'font-weight': 500,
          'text-valign': 'center',
          'text-halign': 'center',
          'text-wrap': 'wrap',
          'text-max-width': '45px',
          'border-width': 3,
          'border-color': '#F7F3ED',
          'transition-property': 'opacity',
          'transition-duration': '0.3s'
        }
      },
      /* Keyword/concept nodes */
      {
        selector: 'node.keyword',
        style: {
          'background-color': '#C8A43C',
          'label': 'data(label)',
          'shape': 'ellipse',
          'width': 30,
          'height': 30,
          'color': '#1A1A1A',
          'font-family': '"DM Sans", sans-serif',
          'font-size': '7px',
          'font-weight': 600,
          'text-valign': 'center',
          'text-halign': 'center',
          'border-width': 2,
          'border-color': '#1A1A1A',
          'transition-property': 'opacity',
          'transition-duration': '0.3s'
        }
      },
      /* CONVERGES edges */
      {
        selector: 'edge.converges',
        style: {
          'line-color': '#C8A43C',
          'width': 2.5,
          'curve-style': 'bezier',
          'target-arrow-shape': 'triangle',
          'target-arrow-color': '#C8A43C',
          'opacity': 0.75,
          'label': 'data(label)',
          'font-size': '7px',
          'font-family': '"JetBrains Mono", monospace',
          'color': '#888',
          'text-rotation': 'autorotate',
          'text-margin-y': -8,
          'transition-property': 'opacity',
          'transition-duration': '0.3s'
        }
      },
      /* CONTRADICTS edges */
      {
        selector: 'edge.contradicts',
        style: {
          'line-color': '#C23B22',
          'line-style': 'dashed',
          'width': 2.5,
          'curve-style': 'bezier',
          'opacity': 0.7,
          'label': 'data(label)',
          'font-size': '7px',
          'font-family': '"JetBrains Mono", monospace',
          'color': '#C23B22',
          'text-rotation': 'autorotate',
          'text-margin-y': -8,
          'transition-property': 'opacity',
          'transition-duration': '0.3s'
        }
      },
      /* INFORMS edges */
      {
        selector: 'edge.informs',
        style: {
          'line-color': '#5C5A56',
          'width': 1.5,
          'curve-style': 'bezier',
          'target-arrow-shape': 'triangle',
          'target-arrow-color': '#5C5A56',
          'opacity': 0.5,
          'transition-property': 'opacity',
          'transition-duration': '0.3s'
        }
      },
      /* REINFORCES edges */
      {
        selector: 'edge.reinforces',
        style: {
          'line-color': '#2D6B4A',
          'width': 2,
          'curve-style': 'bezier',
          'target-arrow-shape': 'triangle',
          'target-arrow-color': '#2D6B4A',
          'opacity': 0.65,
          'transition-property': 'opacity',
          'transition-duration': '0.3s'
        }
      },
      /* SPOKE_IN / FILED_TO edges */
      {
        selector: 'edge.spoke-in, edge.filed-to',
        style: {
          'line-color': '#D4CFC7',
          'width': 1,
          'curve-style': 'bezier',
          'line-style': 'dotted',
          'target-arrow-shape': 'triangle',
          'target-arrow-color': '#D4CFC7',
          'opacity': 0.35,
          'transition-property': 'opacity',
          'transition-duration': '0.3s'
        }
      },
      /* Dimmed state */
      {
        selector: '.dimmed',
        style: {
          'opacity': 0.15
        }
      },
      /* Highlighted state */
      {
        selector: '.highlighted',
        style: {
          'opacity': 1
        }
      }
    ],
    layout: layoutName === 'grid' ? {
      name: 'grid',
      padding: 60,
      animate: true,
      animationDuration: 1200,
      animationEasing: 'ease-out-cubic'
    } : {
      name: 'cose',
      padding: 60,
      nodeRepulsion: function() { return 15000; },
      idealEdgeLength: function() { return 140; },
      edgeElasticity: function() { return 80; },
      gravity: 0.25,
      numIter: 1000,
      animate: true,
      animationDuration: 1200
    },
    minZoom: 0.3,
    maxZoom: 3,
    wheelSensitivity: 0.3
  });

  /* Hover: highlight connected, dim rest */
  cyInstance.on('mouseover', 'node', function(evt) {
    var node = evt.target;
    var neighborhood = node.neighborhood().add(node);
    cyInstance.elements().addClass('dimmed');
    neighborhood.removeClass('dimmed').addClass('highlighted');
  });

  cyInstance.on('mouseout', 'node', function() {
    cyInstance.elements().removeClass('dimmed highlighted');
  });

  /* Click section node: open doc */
  cyInstance.on('tap', 'node.section-group', function(evt) {
    var id = evt.target.data('id');
    if (document.getElementById('content-' + id)) openDoc(id);
  });

  /* Click keyword: filter mode */
  cyInstance.on('tap', 'node.keyword', function(evt) {
    var node = evt.target;
    var neighborhood = node.neighborhood().add(node);
    cyInstance.elements().addClass('dimmed');
    neighborhood.removeClass('dimmed').addClass('highlighted');
  });

  /* Click node: open detail panel */
  cyInstance.on('tap', 'node.artifact, node.meeting, node.speaker', function(evt) {
    var node = evt.target;
    var data = node.data();
    document.getElementById('graph-detail-type').textContent = (data.nodeType || node.classes()[0] || 'Node').toUpperCase();
    document.getElementById('graph-detail-title').textContent = data.label || data.id;
    document.getElementById('graph-detail-content').textContent = data.content || data.description || '';
    document.getElementById('graph-detail-panel').classList.add('open');
  });

  /* Click edge: tooltip */
  cyInstance.on('tap', 'edge', function(evt) {
    var edge = evt.target;
    var data = edge.data();
    var src = edge.source().data('label') || edge.source().data('id');
    var tgt = edge.target().data('label') || edge.target().data('id');
    document.getElementById('graph-detail-type').textContent = (data.label || data.edgeType || 'EDGE').toUpperCase();
    document.getElementById('graph-detail-title').textContent = src + ' \u2192 ' + tgt;
    document.getElementById('graph-detail-content').textContent = data.description || '';
    document.getElementById('graph-detail-panel').classList.add('open');
  });

  /* Double-click section: zoom to subgraph */
  cyInstance.on('dbltap', 'node.section-group', function(evt) {
    var node = evt.target;
    var neighborhood = node.neighborhood().add(node);
    cyInstance.animate({
      fit: { eles: neighborhood, padding: 60 },
      duration: 600,
      easing: 'ease-out-cubic'
    });
  });

  /* Click background: reset */
  cyInstance.on('tap', function(evt) {
    if (evt.target === cyInstance) {
      cyInstance.elements().removeClass('dimmed highlighted');
      closeDetailPanel();
      cyInstance.animate({
        fit: { eles: cyInstance.elements(), padding: 60 },
        duration: 600,
        easing: 'ease-out-cubic'
      });
    }
  });
}

function closeDetailPanel() {
  document.getElementById('graph-detail-panel').classList.remove('open');
}

/* ============================================
   UTILITIES
   ============================================ */
function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
/* ============================================
   COMMAND PANEL -- CLI Remote Control
   ============================================ */
function runCommand(cmd, sectionId) {
  var panel = document.getElementById('command-panel');
  var title = document.getElementById('cmd-panel-title');
  var cmdLine = document.getElementById('cmd-panel-cmd');
  var body = document.getElementById('cmd-panel-body');
  var status = document.getElementById('cmd-panel-status');

  /* Open panel */
  panel.classList.add('open');
  title.textContent = sectionId ? sectionId.replace(/-/g, ' ').toUpperCase() : 'Room Command';
  cmdLine.textContent = '> ' + cmd + (sectionId ? ' [' + sectionId + ']' : '');
  body.textContent = '';
  status.textContent = 'Running...';
  status.className = 'command-panel-status running';

  /* Get command info and section analysis */
  fetch('/api/command', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ command: cmd, section: sectionId }),
  }).then(function(response) {
    return response.json();
  }).then(function(data) {
    if (data.error) {
      status.textContent = 'Error: ' + data.error;
      status.className = 'command-panel-status error';
      return;
    }

    /* Show section analysis */
    body.innerHTML = '';
    var pre = document.createElement('pre');
    pre.style.whiteSpace = 'pre-wrap';
    pre.style.wordBreak = 'break-word';
    pre.textContent = data.section + (data.analysis || '');
    body.appendChild(pre);

    /* Copy-to-clipboard button */
    var copyBlock = document.createElement('div');
    copyBlock.style.cssText = 'margin-top:20px;padding:16px;background:rgba(247,243,237,0.08);border:1px solid rgba(247,243,237,0.15);border-radius:4px;';
    copyBlock.innerHTML =
      '<div style="font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:rgba(247,243,237,0.4);margin-bottom:8px;">Paste in your CLI</div>' +
      '<div style="font-size:14px;color:var(--mondrian-yellow);font-weight:600;margin-bottom:12px;word-break:break-all;">' + escHtml(data.clipboardCmd) + '</div>' +
      '<button id="copy-cmd-btn" style="font-family:JetBrains Mono,monospace;font-size:11px;padding:8px 16px;background:var(--mondrian-yellow);color:var(--mondrian-black);border:none;border-radius:3px;cursor:pointer;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;">Copy Command</button>';
    body.appendChild(copyBlock);

    /* Wire copy button */
    document.getElementById('copy-cmd-btn').onclick = function() {
      navigator.clipboard.writeText(data.clipboardCmd).then(function() {
        document.getElementById('copy-cmd-btn').textContent = 'Copied!';
        setTimeout(function() {
          document.getElementById('copy-cmd-btn').textContent = 'Copy Command';
        }, 2000);
      });
    };

    status.textContent = data.message;
    status.className = 'command-panel-status done';
  }).catch(function(err) {
    status.textContent = 'Failed: ' + err.message;
    status.className = 'command-panel-status error';
    body.textContent = 'Could not connect to hub server.\nMake sure the hub is running on localhost.';
  });
}

function closeCommandPanel() {
  document.getElementById('command-panel').classList.remove('open');
}

/* Close panel on Escape */
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeCommandPanel();
});
</script>
