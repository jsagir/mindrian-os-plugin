services:
  - type: web
    name: mindrian-brain
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node server.cjs
    rootDir: mcp-server-brain
    envVars:
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        value: pws-brain
      # Phase 127.1 Plan 03: server-side query-embedding (e5-large hosted
      # inference). Pinecone embedded query text via integrated inference;
      # Neo4j has none, so the rewired brain_search path embeds query text
      # itself via lib/query-embedder.cjs. Both are operator-provisioned.
      - key: EMBEDDING_API_URL
        sync: false
      - key: EMBEDDING_API_KEY
        sync: false
      - key: BRAIN_API_KEYS
        sync: false
      - key: SUPABASE_URL
        value: https://ulmymxxmvsehjiyymqoi.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Phase 127.1 Plan 05 (D-MOAT-2): brain_query / brain_schema execution
      # safeguards, ported from the official Neo4j mcp-neo4j-cypher recipe.
      # Bounds exfiltration on any read the brain_query admin gate still permits.
      - key: BRAIN_CYPHER_MAX_ROWS
        value: "1000"
      - key: BRAIN_CYPHER_MAX_ESTIMATED_ROWS
        value: "5000"
      - key: BRAIN_CYPHER_MAX_BYTES
        value: "524288"
      - key: BRAIN_CYPHER_TIMEOUT_MS
        value: "5000"
    autoDeploy: true
