  Security contract (R-87-09-CSRF gaps 1-6 closed by serve-dashboard-live):
    1. Origin allowlist excludes Origin: null by default.
    2. Host header is validated server-side against the bound port.
    3. Bearer tokens are Origin-bound at the server.
    4. All responses carry X-Frame-Options / CSP / nosniff / referrer.
    5. Server log redaction scrubs the api_key if it ever touches stderr.
    6. CSRF double-submit: the panel reads mos_csrf from document.cookie
       and echoes it back via X-CSRF-Token on every /api/room/chat call.

  Browser-side rules:
    - api_key lives in sessionStorage ONLY -- cleared on tab close.
      Persistent browser storage (document-level) is NEVER used.
    - Every fetch uses credentials: 'include' so the mos_csrf cookie
      flows on the subsequent /api/room/chat call.
    - On a 401 (token expired), the panel auto re-authenticates ONCE
      and retries before surfacing the error.
-->

<div id="mos-chat-panel">
  <div id="mos-chat-messages" aria-live="polite"></div>
  <form id="mos-chat-form">
    <input
      type="password"
      id="mos-api-key"
      placeholder="Anthropic API key (sk-ant-...)"
      autocomplete="off"
    />
    <textarea
      id="mos-chat-input"
      placeholder="Ask Larry about your room..."
      rows="2"
    ></textarea>
    <button type="submit">Send</button>
  </form>
</div>

<style>
  #mos-chat-panel {
    position: fixed;
    right: 16px;
    bottom: 16px;
    width: 360px;
    max-height: 60vh;
    display: flex;
    flex-direction: column;
    background: #1a1a1a;
    color: #e8e8e8;
    border: 2px solid #c8a43c;
    z-index: 10000;
    font-family: 'DM Sans', 'Inter', system-ui, sans-serif;
    font-size: 13px;
  }
  #mos-chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #mos-chat-messages .user {
    background: #2b3a55;
    padding: 6px 10px;
    align-self: flex-end;
    max-width: 85%;
  }
  #mos-chat-messages .larry {
    background: #3a2b2b;
    padding: 6px 10px;
    align-self: flex-start;
    max-width: 85%;
  }
  #mos-chat-messages .error {
    background: #6b1b1b;
    padding: 6px 10px;
    color: #ffb0b0;
  }
  #mos-chat-form {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 8px;
    border-top: 1px solid #333;
  }
  #mos-chat-form input,
  #mos-chat-form textarea {
    background: #0f0f0f;
    color: #e8e8e8;
    border: 1px solid #444;
    padding: 6px 8px;
    font: inherit;
  }
  #mos-chat-form button {
    background: #c8a43c;
    color: #1a1a1a;
    border: none;
    padding: 6px 10px;
    font-weight: 600;
    cursor: pointer;
  }
  #mos-chat-form button:hover { background: #d7b44d; }
</style>

<script>
/* Phase 87-09 / v1.10.12 BYO-API chat client. License: BUSL-1.1. */
(function () {
  var form = document.getElementById('mos-chat-form');
  if (!form) return;
  var input = document.getElementById('mos-chat-input');
  var keyInput = document.getElementById('mos-api-key');
  var messages = document.getElementById('mos-chat-messages');

  /* R-87-09-CSRF gap 6: read mos_csrf from document.cookie for the
   * X-CSRF-Token header echo. The cookie intentionally omits HttpOnly
   * so this JS read works (double-submit pattern). */
  function getCsrfCookie() {
    var m = document.cookie.match(/(?:^|; )mos_csrf=([^;]+)/);
    return m ? m[1] : '';
  }

  function appendMessage(cls, text) {
    var div = document.createElement('div');
    div.className = cls;
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  /* sessionStorage (tab-scoped, cleared on tab close) holds the api_key.
   * Persistent document-level storage is intentionally avoided. If the
   * key hasn't been entered in this tab yet, we fall back to the
   * visible input. */
  async function getToken() {
    var apiKey = sessionStorage.getItem('mos_api_key') || (keyInput && keyInput.value);
    if (!apiKey) throw new Error('API key required');
    if (!apiKey.startsWith('sk-')) throw new Error('API key must start with sk-');
    sessionStorage.setItem('mos_api_key', apiKey);
    var r = await fetch('/api/auth/session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      /* credentials: 'include' so the Set-Cookie mos_csrf from the
       * response is installed into document.cookie for the subsequent
       * /api/room/chat call. */
      credentials: 'include',
      body: JSON.stringify({ api_key: apiKey }),
    });
    if (!r.ok) throw new Error('auth failed (' + r.status + ')');
    var data = await r.json();
    sessionStorage.setItem('mos_token', data.token);
    return data.token;
  }

  async function sendChatOnce(token) {
    var csrf = getCsrfCookie();
    return fetch('/api/room/chat', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token,
        /* R-87-09-CSRF gap 6: echo the cookie value in the header. */
        'X-CSRF-Token': csrf,
      },
      credentials: 'include',
      body: JSON.stringify({ message: input.value }),
    });
  }

  async function sendChat(message) {
    var token = sessionStorage.getItem('mos_token');
    if (!token) token = await getToken();
    var r = await sendChatOnce(token);
    if (r.status === 401) {
      /* Token expired or Origin-mismatch -- re-auth ONCE, which re-sets
       * the mos_csrf cookie, then retry. */
      sessionStorage.removeItem('mos_token');
      token = await getToken();
      r = await sendChatOnce(token);
    }
    if (!r.ok) throw new Error('chat failed: ' + r.status);
    var data = await r.json();
    return data.reply;
  }

  form.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var msg = (input.value || '').trim();
    if (!msg) return;
    appendMessage('user', msg);
    var originalMsg = msg;
    input.value = '';
    try {
      var reply = await sendChat(originalMsg);
      appendMessage('larry', reply);
    } catch (e) {
      appendMessage('error', e && e.message ? e.message : String(e));
    }
  });
})();
</script>
