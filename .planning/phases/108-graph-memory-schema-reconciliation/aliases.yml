# .planning/phases/108-graph-memory-schema-reconciliation/aliases.yml
# Schema version: 1
#
# Purpose: machine-readable mapping of Codex-proposed terms (and any future
# parallel-schema attempts) to existing canonical terms. Loaded by the pre-commit
# hook (Plan 108-05) at commit time. Mirrors RECONCILIATION.md (Plan 108-01)
# in machine-readable form.
#
# HARD RULE: every entry has resolution in {EXISTS, EXTEND, NEW, RESERVED}.
# HARD RULE: every entry has a non-empty canon_parts list.
# HARD RULE: RESERVED entries carry deferred_to_phase.
# HARD RULE: zero em-dashes or en-dashes anywhere in this file.
#
# Future contributors who try to invent new edge or node names get
# pointed here. Net-new table names not in the alias resolution column
# fail the pre-commit hook.

