<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room, live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="canon-v3-tokens.css">
<style>
  body { min-height: 100vh; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 32px 16px 64px; display: grid; grid-template-columns: repeat(12, 1fr); gap: 0 24px; }
  header { grid-column: 1 / -1; border-bottom: 2px solid var(--line); padding-bottom: 20px; margin-bottom: 24px; }
  .eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 10px; }
  h1 { font-family: var(--font-display); font-weight: 600; font-optical-sizing: auto; font-size: clamp(34px, 5vw, 56px); line-height: 1.02; margin: 0 0 14px; }
  h1 em { font-style: italic; color: var(--rust); }
  .state { font-size: 16px; margin: 0; }
  .state.ok { color: var(--ink); }
  .state.bad { color: var(--error); }
  #counts { font-family: var(--font-mono); font-size: 13px; color: var(--ink-soft); margin: 8px 0 0; }
  main { grid-column: 1 / span 8; }
  aside { grid-column: 9 / -1; border-left: 1px solid var(--line); padding-left: 24px; }
  @media (max-width: 860px) { main, aside { grid-column: 1 / -1; } aside { border-left: 0; border-top: 1px solid var(--line); padding: 20px 0 0; margin-top: 24px; } }
  h2 { font-family: var(--font-ui); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; margin: 0 0 12px; color: var(--ink); }
  #room { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
  .region { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 12px; background: var(--paper); }
  .region h3 { font-family: var(--font-mono); font-weight: 600; font-size: 12px; margin: 0 0 10px; word-break: break-all; }
  .region .n { color: var(--ink-soft); font-weight: 400; }
  .tiles { display: flex; flex-wrap: wrap; gap: 4px; }
  .tile { width: 16px; height: 16px; display: inline-block; }
  .tile.square { background: var(--rust); }
  .tile.black { background: var(--ink); }
  .tile.white { background: var(--paper-light); outline: 1px solid var(--ink); outline-offset: -1px; }
  .tile.error { background: var(--error); }
  .tile.fresh { animation: snap 420ms var(--ease) both; }
  @keyframes snap { from { transform: translateY(-12px); opacity: 0; } to { transform: none; opacity: 1; } }
  .more { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); margin: 8px 0 0; }
  .legend { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); margin: 10px 0 0; }
  #ledger { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  #ledger li { display: grid; grid-template-columns: 20px 80px 1fr; gap: 2px 8px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  #ledger li .mark { margin-top: 3px; }
  #ledger li.fresh { animation: rise 420ms var(--ease) both; }
  @keyframes rise { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
  .kind { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); padding-top: 1px; }
  .what { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  #ledger time { grid-column: 3; font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); }
  #err { color: var(--error); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Spike 006 / read copy / one way</p>
    <h1>The room, <em>as it changes.</em></h1>
    <p id="live" class="state" role="status" aria-live="polite">Connecting to the room...</p>
    <p id="counts"></p>
    <p id="err" role="alert"></p>
  </header>
  <main>
    <h2>Sections and entries</h2>
    <div id="room"></div>
    <p class="legend">rust square = confirmed / white tile = proposed / black square = decision / red = rejected. Superseded entries leave the view.</p>
  </main>
  <aside>
    <h2>Most recent</h2>
    <ol id="ledger"></ol>
  </aside>
</div>
<script src="app.js"></script>
</body>
</html>
